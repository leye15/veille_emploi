profil_texte: |
  Étudiante en master GAED (géographie, aménagement, environnement et
  développement), à la recherche d'un stage de master pour 2027.
  Postes visés : chargée d'études ou de mission (eau, milieux aquatiques,
  zones humides, risque inondation, biodiversité, climat, GEMAPI),
  géomaticienne, assistante chef de projet, animation Natura 2000 / SAGE,
  éducation à l'environnement.
  Compétences : SIG (QGIS), cartographie, analyse spatiale, RStudio,
  diagnostic territorial, état initial de l'environnement, étude d'impact,
  enquête de terrain, concertation, sciences participatives.
  Structures visées : syndicats de rivière, agences de l'eau, PNR, CEN, CPIE,
  collectivités, bureaux d'études, associations naturalistes.
  Territoires : Rouen/Normandie, Toulouse/Occitanie, Nantes/Loire-Atlantique,
  Castres/Tarn. Une offre qui n'est PAS un stage doit recevoir une note basse.
